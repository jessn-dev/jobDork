# The Microsoft Store identity of jobdork's MSIX package (packaging/build.py,
# msix), from Partner Center → the app → Product management → Product
# identity. Not secret: every package carries it.
#
# Left empty, the build makes a package with a stand-in identity, for CI to
# install and self-test only; the Store refuses it.
name = ""                    # Package/Identity/Name
publisher = ""               # Package/Identity/Publisher, "CN=..."
publisher_display_name = ""  # Package/Properties/PublisherDisplayName
