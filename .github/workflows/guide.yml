# The user guide (guide/), built on every pull request that touches it and
# published to GitHub Pages from main: https://jessn-dev.github.io/jobDork/
# With it go the README's coverage and vulnerability badges (badges/*.json,
# scripts/badges.py), so they are measured again on every push to main and
# every Monday, when new advisories may have appeared.
#
# A pull request builds the guide in strict mode, so a broken link or a
# missing picture fails the check before it merges. Only main publishes.
# The repository's Settings → Pages → Source must be "GitHub Actions"
# (set once, by the owner).

name: "Guide: build the user guide website; publish it from main"

on:
  push:
    branches: [main]
  pull_request:
    paths: ["guide/**", ".github/workflows/guide.yml"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build the guide (strict), coverage and badges"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Build the guide (strict)
        run: |
          python -m pip install --quiet --require-hashes -r requirements-ci.lock
          mkdocs build -f guide/mkdocs.yml -d "$RUNNER_TEMP/site"

      # The badges: test coverage, and known vulnerabilities in exactly the
      # dependencies the image and the installers carry (requirements.lock).
      - name: Measure coverage and audit the dependencies
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python -m pip install --quiet --no-deps --no-build-isolation -e .
          python -m coverage run --source=jobdork -m pytest -q
          python -m coverage json -o "$RUNNER_TEMP/coverage.json"
          # pip-audit exits 1 when it finds something; the badge says what.
          pip-audit -r requirements.lock --require-hashes --disable-pip \
            -f json -o "$RUNNER_TEMP/audit.json" || true
          python scripts/badges.py "$RUNNER_TEMP/coverage.json" "$RUNNER_TEMP/audit.json" \
            "$RUNNER_TEMP/site/badges"

      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  publish:
    name: "Publish the guide to GitHub Pages"
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write          # publish to GitHub Pages
      id-token: write       # prove to Pages which workflow is publishing
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Publish
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
