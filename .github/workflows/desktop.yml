name: "Installers: build and self-test the Mac, Windows and Linux apps"

# Builds the desktop app: a .dmg for Apple Silicon Macs, one for Intel Macs,
# the Windows installer, and for Linux an AppImage and a .deb, each with
# packaging/build.py, which also runs the built app's self-test. The result
# is kept as a workflow artifact for a week.
#
# Not triggered on its own: docker.yml calls it on every push and pull
# request, so a release tag publishes nothing until every installer has
# built, and its release-page job attaches them to the GitHub Release after
# you approve the run in the `release` environment. Run it by hand
# (Actions → "Installers: build and self-test..." → Run workflow) for a build
# of any branch.
#
# Unsigned (docs/DECISIONS.md, 2026-10-21). On a tag each installer gets a
# build provenance attestation instead: proof, checked with
# `gh attestation verify`, that this repository's workflow built that exact
# file from that commit.

on:
  workflow_call:
    inputs:
      pictures:
        description: Photograph the Windows installer and uninstaller
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      pictures:
        description: Photograph the Windows installer and uninstaller
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: "Build the ${{ matrix.label }} installer"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Named, not -latest: the architecture is part of what is shipped.
          # macos-15 is Apple Silicon, macos-15-intel Intel (from 0.15.3).
          - os: macos-15
            label: Mac (Apple Silicon)
            file: dist/jobdork-*-macos-arm64.dmg
          - os: macos-15-intel
            label: Mac (Intel)
            file: dist/jobdork-*-macos-x86_64.dmg
          - os: windows-2025
            label: Windows
            # Inno Setup 6 comes installed on this image.
            file: dist/jobdork-*-windows-x64-setup.exe
          # 22.04: the oldest glibc (2.35) Qt's wheels run on, so the build
          # runs on every Linux from then on.
          - os: ubuntu-22.04
            label: Linux
            file: |
              dist/jobdork-*-linux-x86_64.AppImage
              dist/jobdork_*_amd64.deb
            appimage: x86_64
            tool_sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
            runtime_sha256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          # ARM64 (from 0.16.4): PyQt6's ARM wheels need glibc 2.39, so 24.04,
          # and the .deb runs on Ubuntu 24.04, Debian 13 or newer.
          - os: ubuntu-24.04-arm
            label: Linux (ARM64)
            file: |
              dist/jobdork-*-linux-aarch64.AppImage
              dist/jobdork_*_arm64.deb
            appimage: aarch64
            tool_sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
            runtime_sha256: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write        # the attestation is signed with GitHub's identity
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 3.13: what the macOS build was first made and tried with.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      # Every package at the exact version and SHA-256 in the lock: one that
      # changed on PyPI, or is not listed, stops the build rather than going
      # into an installer GitHub then attests. jobdork itself goes in last,
      # with nothing more fetched.
      - name: Install, pinned and hash-checked
        # bash on Windows too: PowerShell would run the second line after the
        # first failed, and the step would pass.
        shell: bash
        run: |
          pip install --require-hashes -r requirements-desktop.lock
          pip install --no-deps --no-build-isolation -e .

      # What Qt and its web engine load from the system, for the self-test's
      # import of them: the .deb's own list (packaging/build.py), by the
      # names Ubuntu 22.04 uses.
      - name: "Linux: the system libraries Qt needs"
        if: runner.os == 'Linux'
        run: |
          pkgs=$(python3 -c "import sys; sys.path.insert(0, 'packaging'); import build; print(' '.join(build.build_packages()))")
          # An Ubuntu mirror this runner can reach (scripts/ci_apt_mirror.sh).
          sudo sh scripts/ci_apt_mirror.sh
          sudo apt-get -o Acquire::Retries=3 install -y -q --no-install-recommends $pkgs

      # appimagetool and the AppImage runtime it puts in front of the app,
      # pinned by version and SHA-256 (GitHub's digests for the release
      # files), so the build fetches nothing it has not checked.
      - name: "Linux: fetch appimagetool and the AppImage runtime, checked"
        if: runner.os == 'Linux'
        env:
          TOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${{ matrix.appimage }}.AppImage
          TOOL_SHA256: ${{ matrix.tool_sha256 }}
          RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-${{ matrix.appimage }}
          RUNTIME_SHA256: ${{ matrix.runtime_sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/appimage"
          cd "$RUNNER_TEMP/appimage"
          curl -fsSL -o appimagetool "$TOOL_URL"
          curl -fsSL -o runtime "$RUNTIME_URL"
          printf '%s  appimagetool\n%s  runtime\n' "$TOOL_SHA256" "$RUNTIME_SHA256" | sha256sum -c -
          chmod +x appimagetool
          echo "APPIMAGETOOL=$PWD/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME=$PWD/runtime" >> "$GITHUB_ENV"

      - name: Build, self-test and package
        run: python packaging/build.py

      - name: Attest where the installer came from
        id: attest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.file }}

      # The attestation's signed Sigstore bundle, kept beside the installer
      # and put on the release page as <installer>.sigstore.json: it lets
      # `gh attestation verify --bundle` check a download offline, and it is
      # what OpenSSF Scorecard looks for as a signed release.
      - name: Keep the signed attestation beside the installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          FILE: ${{ matrix.file }}
        run: for f in $FILE; do cp "$BUNDLE" "$f.sigstore.json"; done

      - name: Keep the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ matrix.file }}
            dist/*.sigstore.json
          if-no-files-found: error
          retention-days: 7

      # The Microsoft Store's package (packaging/build.py, msix): kept apart
      # from the installers, so it never lands on the release page; you
      # upload it in Partner Center, and the Store signs it.
      - name: Keep the Microsoft Store package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-Windows-X64
          path: dist/jobdork-*-windows-x64.msix
          if-no-files-found: error
          retention-days: 7

  # The Store's package, installed for real: a copy signed with a
  # certificate made here for its publisher (the Store signs the real one),
  # trusted on this runner only, installed with Add-AppxPackage, its
  # self-test run through the `jobdork` command the package declares, its
  # identity checked, then removed.
  store:
    name: "Microsoft Store: install the MSIX and run its self-test"
    needs: build
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Fetch the Store package the build made
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: store-Windows-X64
          path: dist

      - name: Sign a test copy, install it, self-test, remove
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = (Get-ChildItem dist\jobdork-*-windows-x64.msix).FullName
          Copy-Item $msix test.msix
          # The publisher the package names, for the certificate's subject.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path test.msix))
          $reader = New-Object IO.StreamReader(($zip.Entries | Where-Object FullName -eq 'AppxManifest.xml').Open())
          [xml]$manifest = $reader.ReadToEnd(); $reader.Close(); $zip.Dispose()
          $publisher = $manifest.Package.Identity.Publisher
          $name = $manifest.Package.Identity.Name
          "package $name, publisher $publisher, version $($manifest.Package.Identity.Version)"
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature `
            -CertStoreLocation Cert:\CurrentUser\My -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          Export-Certificate -Cert $cert -FilePath test.cer | Out-Null
          Import-Certificate -FilePath test.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $signtool = (Get-ChildItem "$kits\10.*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /fd SHA256 /sha1 $cert.Thumbprint test.msix
          if ($LASTEXITCODE) { throw "signtool failed" }
          Add-AppxPackage -Path test.msix
          $pkg = Get-AppxPackage -Name $name
          if (-not $pkg) { throw 'not installed' }
          $alias = "$env:LOCALAPPDATA\Microsoft\WindowsApps\jobdork.exe"
          if (-not (Test-Path $alias)) { throw 'the jobdork command was not declared' }
          $env:JOBDORK_HOME = "$env:RUNNER_TEMP\store-home"
          $report = "$env:RUNNER_TEMP\store-report.txt"
          $run = Start-Process -FilePath $alias -ArgumentList '--self-test', $report -Wait -PassThru
          "--- self-test (exit $($run.ExitCode)):"; Get-Content $report
          if ((Get-Content $report -Raw).Trim() -ne 'ok') { throw 'the self-test failed' }
          Remove-AppxPackage -Package $pkg.PackageFullName
          if (Get-AppxPackage -Name $name) { throw 'not removed' }
          'installed, self-tested and removed'

  # The Linux builds, tried on the systems people run, not only the one they
  # were built on (which has every library a developer's machine has):
  # the .deb installed with apt in bare Ubuntu 22.04, Ubuntu 24.04 and Debian 12
  # containers, its self-test run there, and every library the app's files
  # ask for that the system does not have listed (ldd); then on the runner
  # the real window opened on a virtual screen, left a while, and
  # photographed, and the AppImage's self-test.
  linux:
    name: "Linux (${{ matrix.label }}): install on Ubuntu and Debian, and open the window"
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: x86-64
            artifact: desktop-Linux-X64
            deb: amd64
            appimage: x86_64
            images: ubuntu:22.04 ubuntu:24.04 debian:12
          # glibc 2.39 and newer only (packaging/build.py, LINUX).
          - os: ubuntu-24.04-arm
            label: ARM64
            artifact: desktop-Linux-ARM64
            deb: arm64
            appimage: aarch64
            images: ubuntu:24.04 debian:13
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEB_ARCH: ${{ matrix.deb }}
      APPIMAGE_ARCH: ${{ matrix.appimage }}
      IMAGES: ${{ matrix.images }}
    steps:
      # Only for scripts/ci_apt_mirror.sh.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Fetch the Linux builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Install the .deb on bare Ubuntu and Debian
        run: |
          cat > check.sh <<'SH'
          set -e
          export DEBIAN_FRONTEND=noninteractive
          sh /ci_apt_mirror.sh > /dev/null
          apt-get install -y -qq /dist/jobdork_*_"$DEB_ARCH".deb > /dev/null
          # Searched as the app searches: its own folder first. Every file:
          # a library the build machine had and a bare system lacks fails here.
          echo "--- libraries the app's files ask for that this system lacks:"
          missing=$(find /opt/jobdork -type f \( -name '*.so*' -o -name jobdork \) \
            | while read -r f; do
                m=$(LD_LIBRARY_PATH=/opt/jobdork/_internal ldd "$f" 2>&1 | grep 'not found' | awk '{print $1}' | tr '\n' ' ')
                [ -z "$m" ] || echo "${f#/opt/jobdork/_internal/}: $m"
              done)
          echo "${missing:-none}"
          test -z "$missing"
          export JOBDORK_HOME=/tmp/home
          jobdork --self-test /tmp/report || true
          echo "--- self-test:"; cat /tmp/report
          test "$(cat /tmp/report)" = ok
          test -x /usr/bin/jobdork && test -f /usr/share/applications/jobdork.desktop
          test -f /usr/share/metainfo/io.github.jessn_dev.jobdork.metainfo.xml
          test -f /usr/share/icons/hicolor/512x512/apps/jobdork.png
          apt-get remove -y -qq jobdork > /dev/null
          test ! -e /opt/jobdork/jobdork
          echo "installed, self-tested and removed"
          SH
          for image in $IMAGES; do
            echo "=== $image"
            docker run --rm -e DEB_ARCH -v "$PWD/dist:/dist:ro" -v "$PWD/check.sh:/check.sh:ro" \
              -v "$PWD/scripts/ci_apt_mirror.sh:/ci_apt_mirror.sh:ro" "$image" sh /check.sh
          done

      # The window, drawn: jobdork started on a virtual screen, given time to
      # start its server and draw the page, then photographed. Still running
      # after that is the pass; the picture shows what it drew.
      - name: Open the window and photograph it
        run: |
          # An Ubuntu mirror this runner can reach (scripts/ci_apt_mirror.sh).
          sudo sh scripts/ci_apt_mirror.sh
          sudo apt-get install -y -q --no-install-recommends xvfb x11-apps imagemagick libgl1-mesa-dri ./dist/jobdork_*_"$DEB_ARCH".deb
          mkdir -p pictures
          export JOBDORK_HOME="$RUNNER_TEMP/window" JOBDORK_UPDATE_CHECK=off JOBDORK_NOTIFY=off
          cat > window.sh <<'SH'
          jobdork > "$JOBDORK_HOME.out" 2>&1 &
          pid=$!
          sleep 30
          xwd -root -silent | convert xwd:- pictures/linux-window.png
          if kill -0 "$pid" 2>/dev/null; then echo "still running after 30 s"; kill "$pid"; else echo "jobdork stopped"; exit 1; fi
          SH
          mkdir -p "$JOBDORK_HOME"
          code=0
          xvfb-run -a -s "-screen 0 1400x900x24" sh window.sh || code=$?
          echo "--- what it printed:"; cat "$JOBDORK_HOME.out" || true
          echo "--- its log:"; cat "$JOBDORK_HOME/logs/app.log" 2>/dev/null || true
          exit $code

      - name: The AppImage's self-test
        run: |
          app=$(ls dist/jobdork-*-linux-"$APPIMAGE_ARCH".AppImage)
          # After the window: the .deb it installed brought the libraries every
          # desktop has (EGL, fonts, X11), which this server image lacks and the
          # AppImage leaves to the system, as the .deb does.
          chmod +x "$app"
          # Unpacked to run: the runner has no FUSE.
          APPIMAGE_EXTRACT_AND_RUN=1 JOBDORK_HOME="$RUNNER_TEMP/home" "$app" --self-test "$RUNNER_TEMP/report" || true
          cat "$RUNNER_TEMP/report"
          test "$(cat "$RUNNER_TEMP/report")" = ok

      - name: Keep the picture
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-pictures-${{ matrix.deb }}
          path: pictures/
          if-no-files-found: warn
          retention-days: 7

  # The WinGet manifest, tried for real on every pull request: written for the
  # installer just built (scripts/winget_manifest.py), checked with `winget
  # validate`, installed with `winget install --manifest` the way WinGet's
  # own checks install a submission (silently, as the runner's user), checked
  # in what Windows lists, then removed with `winget uninstall`. The
  # installer is served from the runner itself; nothing is published.
  winget:
    name: "WinGet: install and uninstall the Windows build for real"
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Fetch the Windows installer the build made
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-Windows-X64
          path: dist

      # The image's software list does not name winget; if it is missing,
      # Microsoft's own module puts it there, at a pinned version.
      - name: Make sure winget is there
        shell: pwsh
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -Force | Out-Null
            Install-Module Microsoft.WinGet.Client -RequiredVersion 1.29.380 -Repository PSGallery -Scope AllUsers -Force
            Repair-WinGetPackageManager -AllUsers -Force
          }

      - name: Write a manifest for this build
        shell: bash
        run: |
          exe=$(ls dist/jobdork-*-windows-x64-setup.exe)
          name=$(basename "$exe")
          version=${name#jobdork-}
          version=${version%-windows-x64-setup.exe}
          python scripts/winget_manifest.py "$version" --out winget --installer "$exe" \
            --url "http://127.0.0.1:8765/$name" --iss packaging/jobdork.iss --date "$(date -u +%F)"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # winget marks what it downloads as from the internet, and Windows then
      # holds an unsigned installer at a security prompt before it starts:
      # on this runner nobody can answer it, and the install waits forever.
      # Tried 2026-10-27: the same installer, silent, installs in a second
      # without the mark and never starts with it. Here, on a runner thrown
      # away after the job, .exe files count as low risk, so the test checks
      # the manifest, the silent install and the uninstall, not the prompt.
      # On a person's computer the prompt shows until the installer is signed.
      - name: Let this runner start a downloaded unsigned installer
        shell: pwsh
        run: |
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\Associations'
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name LowRiskFileTypes -Value '.exe'

      - name: Install it with winget, check it, remove it
        shell: pwsh
        run: |
          winget --version
          $manifest = "winget/manifests/j/jessn-dev/jobdork/$env:VERSION"
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', 'dist' -PassThru -WindowStyle Hidden
          try {
            winget settings --enable LocalManifestFiles
            $checked = winget validate --manifest $manifest | Out-String
            Write-Output $checked
            if ($LASTEXITCODE -and $checked -notmatch 'succeeded with warnings') { throw "winget validate failed ($LASTEXITCODE)" }

            # With a time limit and the installer's own log: a silent install
            # that waits on something shows nothing but a spinner, so on the
            # limit say what is still running and what both logs say.
            $log = Join-Path $PWD 'inno-install.log'
            $install = Start-Process winget -PassThru -NoNewWindow -ArgumentList @(
              'install', '--manifest', $manifest, '--silent', '--disable-interactivity',
              '--accept-package-agreements', '--accept-source-agreements', '--log', $log)
            if (-not $install.WaitForExit(300000)) {
              Write-Output '--- still running after 5 minutes:'
              Get-CimInstance Win32_Process | Sort-Object ProcessId |
                Format-Table ProcessId, ParentProcessId, Name, CommandLine -AutoSize -Wrap | Out-String -Width 300
              Get-Process | Where-Object { $_.MainWindowTitle } | Format-Table Id, ProcessName, MainWindowTitle -AutoSize
              Write-Output '--- the installer log:'
              if (Test-Path $log) { Get-Content $log -Tail 60 }
              Write-Output '--- winget log:'
              $diag = "$env:LOCALAPPDATA\Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\LocalState\DiagOutputDir"
              Get-ChildItem $diag -Filter *.log -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1 | Get-Content -Tail 60
              throw 'winget install did not finish in 5 minutes'
            }
            if ($install.ExitCode) {
              if (Test-Path $log) { Get-Content $log -Tail 60 }
              throw "winget install failed ($($install.ExitCode))"
            }
            # What WinGet matches a package by: the name, version and publisher
            # Windows lists the app under (the AppId in jobdork.iss, with _is1).
            $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{89BA0AFD-43DD-4F5C-ADC2-221D5F8E1EA6}_is1'
            $app = Get-ItemProperty $key
            Write-Output "Listed as '$($app.DisplayName)' $($app.DisplayVersion) by $($app.Publisher) in $($app.InstallLocation)"
            if ($app.DisplayName -ne 'jobdork' -or $app.DisplayVersion -ne $env:VERSION -or $app.Publisher -ne 'jessn-dev') {
              throw 'Windows lists it under a name, version or publisher the manifest does not say'
            }
            $exe = Join-Path $app.InstallLocation 'jobdork.exe'
            if (-not (Test-Path $exe)) { throw "no $exe after installing" }

            winget uninstall --manifest $manifest --silent --disable-interactivity --accept-source-agreements
            if ($LASTEXITCODE) { throw "winget uninstall failed ($LASTEXITCODE)" }
            if (Test-Path $key) { throw 'still listed under Installed apps after uninstalling' }
            if (Test-Path $exe) { throw "$exe is still there after uninstalling" }
            Write-Output 'winget installed and removed jobdork from the manifest.'
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }

  # Pictures of the installer's pages and the uninstaller's window, as they
  # draw on Windows, kept with the run: the uninstaller's own window and the
  # installer's tick boxes once drew wrong on a screen at high scaling, which
  # no test of the files catches. The runner's screen is at 100%.
  windows-pictures:
    name: "Windows: photograph the installer and uninstaller"
    # Only when asked: docker.yml asks when packaging/jobdork.iss changed,
    # and Run workflow has a tick box for it. A release takes none.
    if: inputs.pictures
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Fetch the Windows installer the build made
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-Windows-X64
          path: dist

      - name: Photograph the installer and the uninstaller
        shell: pwsh
        run: |
          # A runner thrown away after the job: let it open a downloaded
          # unsigned installer without Windows' prompt.
          $policy = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\Associations'
          New-Item -Path $policy -Force | Out-Null
          Set-ItemProperty -Path $policy -Name LowRiskFileTypes -Value '.exe'
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory pictures | Out-Null
          function Snap($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("pictures/$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          function Stop-Setup {
            Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -match 'jobdork-.*setup|\\is-[^\\]+\\|unins\d+|_iu' } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          }
          $exe = (Get-Item dist/jobdork-*-windows-x64-setup.exe).FullName
          $shell = New-Object -ComObject WScript.Shell

          Start-Process $exe
          Start-Sleep 8; Snap 'installer-1'
          foreach ($n in 2..3) {
            $null = $shell.AppActivate('Setup - jobdork'); Start-Sleep 1
            $shell.SendKeys('{ENTER}'); Start-Sleep 3; Snap "installer-$n"
          }
          Stop-Setup; Start-Sleep 2

          Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{89BA0AFD-43DD-4F5C-ADC2-221D5F8E1EA6}_is1'
          $uninstaller = ((Get-ItemProperty $key).UninstallString -replace '"', '')
          Start-Process $uninstaller
          Start-Sleep 8; Snap 'uninstaller'
          Stop-Setup; Start-Sleep 2
          Start-Process $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          Get-ChildItem pictures

      - name: Keep the pictures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-pictures
          path: pictures/
          if-no-files-found: error
          retention-days: 7
