name: Test, scan and publish

# Every push and pull request: tests, security scans, and the image built,
# scanned and checked. A release is a version tag (v1.2.3): only a tag
# publishes, only after every check passes, and only once you approve it in
# the `release` environment. The published image is signed and carries a
# record of how and where it was built, and the release gets a GitHub Release
# page naming the exact image. The desktop app is built alongside
# (desktop.yml) and its installers are attached to the same page. See
# SECURITY.md.
#
# Needs, in the repository settings:
#   variable DOCKERHUB_USERNAME   the Docker Hub account the image goes to
#   secret   DOCKERHUB_TOKEN      in the `release` environment: a Docker Hub
#                                 personal access token with the Read & Write
#                                 scope (not Delete), used for nothing else
# The account name is a variable rather than a secret: it is part of the
# image name, which a secret would mask in the logs and blank out on pull
# requests from forks.

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

# The token can read the repository and nothing else, unless a job says so.
permissions:
  contents: read

env:
  # The scanners run from their official images, pinned by digest, rather
  # than through third-party actions, which are one more thing to trust.
  TRIVY: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
  GITLEAKS: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  HADOLINT: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 is the oldest supported; 3.14 is what the image runs.
        python-version: ['3.10', '3.14']
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e '.[dev,pdf,ai]'

      - name: Lint
        run: ruff check jobdork tests scripts

      - name: Test
        run: pytest

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (the whole history, for the secret scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install the scanners
        run: pip install pip-audit==2.10.1 bandit==1.9.4

      # Every dependency the image installs, against the public advisories.
      - name: Dependencies have no known vulnerabilities
        run: pip-audit -r requirements.lock --require-hashes --disable-pip --strict

      # And every one the desktop installers are built from. Platform markers
      # are dropped first: pip-audit skips a package whose marker does not
      # match the machine it runs on, and this one is Linux, while pyobjc is
      # macOS-only and pythonnet Windows-only.
      - name: Desktop dependencies have no known vulnerabilities
        run: |
          sed -E 's/ ; [^\\]*\\$/ \\/' requirements-desktop.lock > "$RUNNER_TEMP/desktop-all.lock"
          pip-audit -r "$RUNNER_TEMP/desktop-all.lock" --require-hashes --disable-pip --strict

      # Medium severity and up, medium confidence and up. A finding judged
      # safe is marked in the code with its reason (`# nosec` and a comment).
      - name: Code scan
        run: bandit -r jobdork -ll -ii -q

      # Every commit ever made, not only the latest: a key committed once and
      # deleted later is still in the history. .gitleaksignore lists the one
      # known false finding, by exact commit and line.
      - name: No secrets in the history
        run: >
          docker run --rm -v "$PWD:/repo:ro"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          "$GITLEAKS" git /repo --redact --no-banner --gitleaks-ignore-path /repo/.gitleaksignore

      - name: Dockerfile lint
        run: docker run --rm -i "$HADOLINT" < Dockerfile

  image:
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # A release tag must name the version the code says it is, or the image
      # tagged 1.2.3 would report another version. Checked before anything is
      # built, so a mismatched tag never reaches the approval step.
      - name: The tag matches the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match version $version in pyproject.toml"
            exit 1
          fi
          echo "tag $TAG matches version $version"
          # And every page that names the release to copy names this one.
          python3 scripts/set_version.py --check

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: jobdork:check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # High and critical, fixed or not: a finding with no fix yet still
      # blocks the release until it is looked at. One that has been, and does
      # not apply, goes in .trivyignore with the reason.
      - name: Scan the image (vulnerabilities, secrets, misconfiguration)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD:/src:ro" "$TRIVY" image --quiet --exit-code 1
          --scanners vuln,secret,misconfig --severity HIGH,CRITICAL
          --ignorefile /src/.trivyignore jobdork:check

      - name: Check what is in the image and how it behaves
        run: scripts/check_image.sh jobdork:check

  # The macOS and Windows installers, built and self-tested on every run so a
  # broken build shows on the pull request, not on release day. Only after
  # the tests and the security scans pass: on a tag the build is attested,
  # and an attestation should never vouch for code that failed a scan.
  desktop:
    needs: [test, security]
    uses: ./.github/workflows/desktop.yml
    permissions:
      contents: read
      id-token: write        # attests the installers on a tag
      attestations: write

  publish:
    # The installers too: a tag whose app does not build publishes nothing,
    # rather than an image with a release page missing its downloads.
    needs: [image, desktop]
    # A version tag, and nothing else: a push to main is built and checked
    # above, but not published.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Waits for your approval (SECURITY.md). The Docker Hub token lives in
    # this environment, so it is only handed to a run you approved.
    environment: release
    outputs:
      image: ${{ vars.DOCKERHUB_USERNAME }}/jobdork
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      id-token: write        # signs the image with GitHub's identity; no key to steal
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # QEMU lets the amd64 runner build the arm64 image (Apple Silicon Macs).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # For the Git tag v1.2.3: 1.2.3, 1.2, latest and sha-abc1234.
      # `latest` is always the newest release.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/jobdork
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,format=short

      # With a provenance record (what source, which workflow, which commit)
      # and a software bill of materials (every package inside), both attached
      # to the image in the registry.
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signing: the signature says "built by this repository's
      # workflow, from this commit", checked against GitHub's identity, and is
      # logged publicly. There is no signing key that could leak. Signed by
      # digest, which names the exact contents; a tag can be moved.
      - name: Sign the image
        env:
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/jobdork@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      # cosign 3 stores the signature as an OCI referrer, and Docker Hub lists
      # a new referrer a few seconds after it is pushed: checked at once, a
      # good signature reads as "no signatures found" (v0.14.3). So retry for
      # up to a minute before calling it missing.
      - name: Verify the signature, as a user would
        env:
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/jobdork@${{ steps.push.outputs.digest }}
          IDENTITY: ^https://github.com/${{ github.repository }}/\.github/workflows/docker\.yml@
        run: |
          for attempt in 1 2 3 4 5 6; do
            if cosign verify "$IMAGE" \
                --certificate-identity-regexp "$IDENTITY" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com; then
              exit 0
            fi
            echo "Attempt $attempt: not verified yet; retrying in 10s"
            sleep 10
          done
          echo "::error::signature did not verify after 6 attempts"
          exit 1

      - name: Record the digest
        run: echo "Published ${{ vars.DOCKERHUB_USERNAME }}/jobdork@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  # A GitHub Release page for the version: the exact image, the desktop
  # installers, how to verify them, and what changed. A separate job, because
  # it needs to write to the repository and publishing must not.
  release-page:
    needs: [publish, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The whole history: what changed is read from the changelog at this
      # tag and at the release before it.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the installers desktop.yml built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: installers
          merge-multiple: true

      - name: Checksums for the installers
        working-directory: installers
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          REPO: ${{ github.repository }}
        # The page (scripts/release_notes.py): the downloads first, because
        # GitHub lists the files after the text; then how to check them; then
        # the changelog's entries since the last release, folded.
        run: |
          version="${TAG#v}"
          python3 scripts/release_notes.py --page "$TAG" "$IMAGE" "$DIGEST" > notes.md
          gh release create "$TAG" --repo "$REPO" --title "jobdork $version" \
            --notes-file notes.md --verify-tag installers/*
