# The user guide, published to GitHub Pages by .github/workflows/guide.yml.
# How to keep it in step with the app: guide/README.md.
site_name: jobdork
site_description: >-
  A free, open-source job search app for your own computer: employers' own
  job boards, screened with your rules and ranked against your resume
site_url: https://jessn-dev.github.io/jobDork/
repo_url: https://github.com/jessn-dev/jobDork
repo_name: jessn-dev/jobDork
edit_uri: edit/main/guide/docs/
docs_dir: docs
strict: true
# Strict turns these warnings into a failed build: a link to a page or a
# section that does not exist stops the guide from publishing.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  # home.html: the landing page's hero (docs/index.md).
  custom_dir: overrides
  logo: images/logo.svg
  favicon: images/logo.svg
  features:
    - navigation.sections
    - navigation.footer
    - search.suggest
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      toggle: {icon: material/weather-sunny, name: Light mode}

extra_css:
  - stylesheets/home.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  # The landing page's card icons, drawn inline from Material's own set.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - def_list
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - The user guide: overview.md
  - Getting started: getting-started.md
  - Using it:
      - Dashboard: dashboard.md
      - Job posts: job-posts.md
      - The job post window: job-window.md
      - Scores explained: scores.md
      - Statuses and tags: statuses.md
  - Setting it up:
      - Search: search.md
      - Resume: resume.md
      - Sources: sources.md
      - AI: ai.md
      - Settings: settings.md
  - Feedback: feedback.md
  - Glossary: glossary.md
