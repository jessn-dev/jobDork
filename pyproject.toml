[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jobdork"
version = "0.15.1"
description = "Local-first ATS job scanner, transparent screening filter, and resume matcher running on your own computer"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "jessn-dev" }]
keywords = [
    "jobs",
    "job-search",
    "ats",
    "ats-scraper",
    "greenhouse",
    "workday",
    "ashby",
    "lever",
    "resume-matcher",
    "local-first",
    "privacy",
    "desktop-app",
    "google-dorks",
    "cli",
]

# The single source of truth for what this needs to run. requirements.txt
# defers to this file rather than repeating it: two lists of dependencies
# drift, and the one that drifts is always the one you did not edit.
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31",
    "resend>=2.0.0",
]

[project.optional-dependencies]
# Only needed to read a PDF resume. Scanning, filtering and tracking all work
# without it, and a missing parser says so rather than scoring nothing.
pdf = ["pypdf>=6.21.2"]
# The Claude provider on the AI page. Ollama, Gemini, ChatGPT and Groq need nothing
# beyond requests.
ai = ["anthropic>=1.8"]
# `jobdork app`: the dashboard in a window of its own rather than a browser tab.
app = ["pywebview>=6.2",
       # Checks an update's build attestation before opening it (core/updates.py).
       "sigstore>=4.5.1",
       # macOS Notification Center under the app's own name (core/notify.py).
       "pyobjc-framework-UserNotifications>=12; sys_platform == 'darwin'"]
# Building the installers (packaging/build.py): PyInstaller, and Pillow to
# turn packaging/icon.png into each platform's icon format.
package = ["pyinstaller>=6.22", "pillow>=11"]
dev = [
    "pytest>=8.0",
    # Exact: each ruff release adds rules, and an open range let CI pick up
    # 0.17.2 and fail on RUF059 that a 0.16 install here passed (#43).
    # Dependabot proposes the next one as a pull request.
    "ruff==0.17.2",
    # The update check's attestation tests verify a real bundle offline.
    "sigstore>=4.5.1",
]

[project.scripts]
jobdork = "jobdork.cli:main"

[project.urls]
Documentation = "https://github.com/jessn-dev/jobDork/tree/main/docs"

[tool.setuptools]
packages = ["jobdork", "jobdork.ai", "jobdork.core", "jobdork.db", "jobdork.dork",
            "jobdork.fetch", "jobdork.output", "jobdork.search", "jobdork.web",
            "jobdork.writing"]

[tool.setuptools.package-data]
jobdork = ["data/*.csv", "data/*.html", "data/*.json", "data/humanizer/*"]

# ── tests ─────────────────────────────────────────────────────────────────────
# The suite is plain functions with asserts, so it runs under pytest without
# any pytest-specific code. `tests/run_all.py` runs the same files with nothing
# installed, which is what makes a fresh clone testable before `pip install`.
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]

# ── linting ───────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [".venv", "out", "data"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # import sorting
    "UP",          # pyupgrade
    "B",           # bugbear
    "SIM",         # simplify
    "C4",          # comprehensions
    "RUF",         # ruff's own
]
ignore = [
    # A bare `except Exception` around one job board is deliberate: an adapter
    # that raises must kill that board and not the run. Every one is commented.
    "BLE001",
    # Multi-line implicit string concatenation is how the prompts and the long
    # explanatory messages are written, and joining them would hurt them.
    "ISC001", "ISC003",
    "E501",        # long lines are caught by the formatter, not the linter
    # En dashes in salary ranges ($99,840–101,920) and typographic apostrophes
    # are correct punctuation, not confusables to be normalised away.
    "RUF001", "RUF002", "RUF003",
    # Dataclass-style config holders use mutable defaults deliberately, via
    # field(default_factory=...) where it matters.
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
# Tests build config objects inline and shadow names freely; that is fine.
"tests/*" = ["B011", "RUF012", "SIM117"]
# The dork generator is the original script, kept working rather than rewritten.
# Linting it to today's style would mean editing 992 working lines for taste,
# which is the change-for-its-own-sake the move deliberately avoided.
"jobdork/dork/*" = ["UP", "SIM", "C4", "B", "RUF005", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["jobdork"]
